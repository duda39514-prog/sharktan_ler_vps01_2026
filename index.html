<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cérebro em Ação</title>

    <link rel="stylesheet" href="index.css">
</head>

<body>

    <main class="pagina">

        <!-- ESTRELAS DECORATIVAS -->
        <div class="estrela estrela-1">★</div>
        <div class="estrela estrela-2">★</div>
        <div class="estrela estrela-3">★</div>
        <div class="estrela estrela-4">★</div>
        <div class="estrela estrela-5">★</div>

        <!-- CABEÇALHO -->
        <header class="cabecalho">
            <h1>Cérebro em Ação</h1>
        </header>


        <!-- ÁREA PRINCIPAL -->
        <section class="conteudo">

            <!-- LADO ESQUERDO -->
            <div class="decoracao">

                <div class="camera">
                    📷
                </div>

                <div class="cartao">
                    <div class="cartao-texto">
                        Greetings!
                    </div>

                    <div class="cartao-paisagem">
                        🌊
                    </div>

                    <div class="cartao-preco">
                        2
                    </div>
                </div>

                <div class="frase">
                    <span>aprenda.</span>
                    <span>descubra.</span>
                    <span>evolua.</span>
                </div>

            </div>


            <!-- LADO DIREITO -->
            <div class="area-formulario">

                <!-- LOGIN -->
                <div class="formulario" id="login">

                    <h2>login</h2>

                    <label for="email-login">E-mail</label>
                    <input
                        type="email"
                        id="email-login"
                        placeholder="Digite seu e-mail"
                    >

                    <label for="senha-login">Senha</label>
                    <input
                        type="password"
                        id="senha-login"
                        placeholder="Digite sua senha"
                    >

                    <div class="opcoes">
                        <label class="lembrar">
                            <input type="checkbox">
                            Lembrar-me
                        </label>

                        <a href="#">Esqueci a senha</a>
                    </div>

                    <button type="submit">
                        Entrar
                    </button>

                    <p class="troca">
                        Ainda não possui cadastro?
                        <a href="#cadastro">Cadastre-se</a>
                    </p>

                </div>


                <!-- CADASTRO -->
                <div class="formulario cadastro" id="cadastro">

                    <h2>cadastro</h2>

                    <label for="nome">Nome:</label>
                    <input
                        type="text"
                        id="nome"
                        placeholder="Digite seu nome"
                    >

                    <label for="serie">Série:</label>
                    <input
                        type="text"
                        id="serie"
                        placeholder="Digite sua série"
                    >

                    <label for="email">E-mail Educacional:</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="Digite seu e-mail"
                    >

                    <label for="rm">RM:</label>
                    <input
                        type="text"
                        id="rm"
                        placeholder="Digite seu RM"
                    >

                    <label for="senha">Senha:</label>
                    <input
                        type="password"
                        id="senha"
                        placeholder="Crie uma senha"
                    >

                    <button type="submit">
                        Cadastrar
                    </button>

                    <p class="troca">
                        Já possui uma conta?
                        <a href="#login">Entrar</a>
                    </p>

                </div>

            </div>

        </section>

    </main>

</body>
</html>
